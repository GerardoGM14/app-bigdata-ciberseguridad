# Blueprint de Render: crea el servicio web de Centinela.
# Las variables marcadas con sync: false se completan en el panel de Render.
services:
  - type: web
    name: centinela
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/salud
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20
      - key: JWT_SECRET
        generateValue: true
      - key: INGESTA_API_KEY
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: APP_URL
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM_EMAIL
        sync: false
